# Spotify has no API for rotating a client secret — it is a button in their
# dashboard — so this cannot rotate anything. It opens an issue instead, which
# is the part that actually gets forgotten.
name: rotation reminder

on:
  schedule:
    # 09:00 UTC on 1 January, 1 May and 1 September. Every four months, not
    # six: the refresh token's lifetime is 180 days, and a six-month cadence
    # can drift past it. GitHub skips scheduled runs on repos with no activity
    # for 60 days, so this is a nudge, not a guarantee.
    - cron: "0 9 1 1,5,9 *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: open the rotation issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Do not stack a second issue on top of one that is still open.
          if [ -n "$(gh issue list --label rotation --state open --json number --jq '.[].number')" ]; then
            echo "a rotation issue is already open — nothing to do"
            exit 0
          fi

          gh label create rotation --color ededed --description "credential rotation" 2>/dev/null || true

          gh issue create \
            --title "rotate the spotify refresh token" \
            --label rotation \
            --body "$(cat <<'BODY'
Four months since the last reminder. The refresh token lasts 180 days, so
this fires with roughly two months of margin.

1. developer.spotify.com/dashboard → the app → Settings → rotate the client secret
2. `node scripts/spotify-token.mjs <client-id> <new-secret>` to mint a fresh refresh token
3. Update `SPOTIFY_CLIENT_SECRET` and `SPOTIFY_REFRESH_TOKEN` in Vercel (Production + Preview) and in the local `.env`
4. Redeploy, then check `/api/now-playing` returns a track rather than `{}`

Close this when done. This one is a real deadline rather than hygiene: when
the refresh token lapses the route fails closed and now-playing simply stops
appearing, with nothing on the page to say why.
BODY
)"
